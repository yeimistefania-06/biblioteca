{% extends 'base.html' %}

{% block content %}
    <div class="container mt-3">
        <h1>Editar Autor</h1>
        <div class="container">
            <form method="POST" action="{% url 'editar_autor' autor.id %}">
            {% csrf_token %}
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input
                        type="text"
                        class="form-control"
                        name="nombre"
                        id="nombre"
                        placeholder="nombre"
                        value="{{autor.nombre}}"
                        required/>
                </div>

                <div class="mb-3">
                    <label for="lugar" class="form-label">Lugar</label>
                    <input
                        type="text"
                        class="form-control"
                        name="lugar"
                        id="lugar"
                        placeholder="lugar"
                        value="{{autor.lugar_nacimiento}}"
                        required/>
                </div>
                <div class="mb-3">
                    <label for="fecha" class="form-label">Fecha</label>
                    <input
                        type="datetime-local"
                        class="form-control"
                        name="fecha"
                        id="fecha"
                        placeholder="fecha"
                        value="{{ autor.fecha_nacimiento|date:'Y-m-d\TH:i' }}"
                        required/>
                </div>
                <input type="submit" class="btn btn-primary" value="actualizar"/>
            </form>
            <form method="POST" action="{% url 'eliminar_autor' autor.id %}">
            {% csrf_token %}
                <input type="submit" class="btn btn-danger" value="eliminar"/>
            </form>
        </div>
    </div>
{% endblock content %}
