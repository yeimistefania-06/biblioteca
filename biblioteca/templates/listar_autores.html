{% extends 'base.html' %}
{% block content %}
<div class="container mt-3">
    <h3>Listado De Autores</h3>
    <div class="justify-content-center text-center mt-3">
        <table class="table table-dark table-striped">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Lugar De Nacimiento</th>
                        <th>Fecha De Nacimiento</th>
                        <th>acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for autor in autores %}
                        <tr>
                            <td>{{autor.nombre}}</td>
                            <td>{{autor.lugar_nacimiento}}</td>
                            <td>{{autor.fecha_nacimiento}}</td>
                            <td>
                                <a href="{% url 'editar_autor' autor.pk %}" class="btn btn-warning">Actualizar</a>
                                <a href="{% url 'eliminar_autor' autor.pk %}" class="btn btn-danger">Eliminar</a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
    </div>
</div>
{% endblock %}
